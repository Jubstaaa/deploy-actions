name: Quality gate

on:
    workflow_call:
        inputs:
            runtime:
                description: 'bun (bun install --frozen-lockfile, bun run) or node (npm ci, npm run).'
                type: string
                default: bun
            node-version-file:
                description: 'File setup-node reads the Node version from, relative to the repository root. Defaults to <working-directory>/package.json for runtime node; with runtime bun, Node is installed only when this is set.'
                type: string
                default: ''
            working-directory:
                description: 'Directory holding package.json and the lockfile.'
                type: string
                default: .
            format:
                description: 'Run the format:check script.'
                type: boolean
                default: true
            lint:
                description: 'Run the lint script.'
                type: boolean
                default: true
            typecheck:
                description: 'Run the typecheck script.'
                type: boolean
                default: true
            test:
                description: 'Run the test script.'
                type: boolean
                default: true
            audit:
                description: 'Run the audit script (e.g. bun audit --audit-level=high).'
                type: boolean
                default: true
            knip:
                description: 'Run the knip script.'
                type: boolean
                default: true
            jscpd:
                description: 'Run the jscpd script.'
                type: boolean
                default: true
            depcruise:
                description: 'Run the depcruise script.'
                type: boolean
                default: true
            build:
                description: 'Run the build script.'
                type: boolean
                default: true
            trivy:
                description: 'Trivy filesystem scan of the repository: vulnerabilities, secrets, misconfiguration; HIGH and CRITICAL with a fix fail.'
                type: boolean
                default: true
            trivy-skip-dirs:
                description: 'Comma-separated directories Trivy skips: installed and built output.'
                type: string
                default: '**/node_modules,**/.next,**/out,**/dist,**/build,**/coverage'
            actionlint:
                description: 'Lint the repository workflows with actionlint (and shellcheck on their run steps).'
                type: boolean
                default: true
            gitleaks:
                description: >-
                    Scan the git history for committed secrets. On a pull
                    request, every commit in it; otherwise the whole history.
                    Needs the full history, so it also deepens the checkout.
                type: boolean
                default: false
            doctor:
                description: 'Run jubstaa-doctor over the repository: LICENSE, README, package.json fields, canonical script names, and no prose comments in YAML.'
                type: boolean
                default: true
            doctor-version:
                description: 'Version range of @jubstaa/config the doctor comes from.'
                type: string
                default: '^1'
            scripts:
                description: >-
                    Extra package.json scripts to run after the standard ones,
                    one name per line. For checks only this project has, such
                    as a committed-migration or generated-file check.
                type: string
                default: ''
            env:
                description: >-
                    Extra environment for the script steps, as KEY=value lines.
                    A build that reads configuration at import time needs this.
                    Workflow inputs are recorded in the run log, so these are
                    placeholders and flags, never secrets.
                type: string
                default: ''

permissions:
    contents: read

jobs:
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: quality-gate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        env:
            RUN: ${{ inputs.runtime == 'node' && 'npm run' || 'bun run' }}
        steps:
            - name: Check inputs
              env:
                  RUNTIME: ${{ inputs.runtime }}
              working-directory: .
              run: |
                  case "$RUNTIME" in
                      bun | node) ;;
                      *) echo "::error::runtime must be bun or node, got '$RUNTIME'"; exit 1 ;;
                  esac
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: ${{ inputs.gitleaks && 0 || 1 }}
            - if: inputs.runtime == 'bun'
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: ${{ inputs.working-directory }}/package.json
            - if: inputs.runtime == 'node' || inputs.node-version-file != ''
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file || format('{0}/package.json', inputs.working-directory) }}
            - name: Install
              env:
                  RUNTIME: ${{ inputs.runtime }}
              run: |
                  if [ "$RUNTIME" = node ]; then
                      npm ci
                  else
                      bun install --frozen-lockfile
                  fi

            - name: Environment for the scripts
              if: inputs.env != ''
              env:
                  EXTRA_ENV: ${{ inputs.env }}
              run: |
                  while IFS= read -r line; do
                      [ -n "$line" ] || continue
                      case "$line" in
                          [A-Za-z_]*=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
                          *) echo "::error::env must be KEY=value lines, got '$line'"; exit 1 ;;
                      esac
                  done <<< "$EXTRA_ENV"

            - if: inputs.format
              run: $RUN format:check
            - if: inputs.lint
              run: $RUN lint
            - if: inputs.typecheck
              run: $RUN typecheck
            - if: inputs.test
              run: $RUN test
            - if: inputs.knip
              run: $RUN knip
            - if: inputs.jscpd
              run: $RUN jscpd
            - if: inputs.depcruise
              run: $RUN depcruise
            - if: inputs.build
              run: $RUN build

            - name: Project scripts
              if: inputs.scripts != ''
              env:
                  SCRIPTS: ${{ inputs.scripts }}
              run: |
                  while IFS= read -r name; do
                      name=$(echo "$name" | tr -d '[:space:]')
                      [ -n "$name" ] || continue
                      case "$name" in
                          *[!a-zA-Z0-9:._-]*)
                              echo "::error::script name must be [A-Za-z0-9:._-], got '$name'"; exit 1 ;;
                      esac
                      echo "::group::$RUN $name"
                      $RUN "$name"
                      echo '::endgroup::'
                  done <<< "$SCRIPTS"

            - name: Repository checks
              if: inputs.doctor
              working-directory: .
              env:
                  DOCTOR_VERSION: ${{ inputs.doctor-version }}
              run: npx --yes --package="@jubstaa/config@$DOCTOR_VERSION" jubstaa-doctor

            - name: actionlint
              if: inputs.actionlint
              working-directory: .
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

            - if: inputs.audit
              run: $RUN audit
            - name: Trivy (vulnerabilities, secrets, misconfiguration)
              if: inputs.trivy
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
                  skip-dirs: ${{ inputs.trivy-skip-dirs }}
                  version: v0.76.2
                  cache-dir: ${{ runner.temp }}/trivy
                  cache: 'false'
            - name: gitleaks
              if: inputs.gitleaks
              working-directory: .
              env:
                  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  range="-m HEAD"
                  [ -z "$BASE_SHA" ] || range="-m $BASE_SHA..HEAD"
                  docker run --rm -v "$PWD:/repo" \
                      -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
                      "$GITLEAKS" git /repo --redact --no-banner --log-opts="$range"
