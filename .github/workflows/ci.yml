name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
            - name: shellcheck
              run: find . -name '*.sh' -not -path './.git/*' -exec shellcheck {} +

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install bats and sqlite3
              run: sudo apt-get update -qq && sudo apt-get install -y -qq bats sqlite3
            - name: bats
              run: bats test
            - name: bats as root (snapshots switch to the database owner)
              run: sudo bats test/compose-snapshots.bats

    # Runs the reusable quality gate against minimal bun and npm projects, so a
    # broken input, runtime branch or pinned step fails here, not in a caller.
    quality-gate:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runtime: bun
                      node-version-file: ''
                    - runtime: node
                      node-version-file: test/fixtures/quality-gate/node/.nvmrc
        uses: ./.github/workflows/quality-gate.yml
        with:
            runtime: ${{ matrix.runtime }}
            node-version-file: ${{ matrix.node-version-file }}
            working-directory: test/fixtures/quality-gate/${{ matrix.runtime }}
            env: |
                GATE_ENV_PROBE=passed
