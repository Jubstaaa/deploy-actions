name: Doctor

on:
    workflow_call:
        inputs:
            doctor-version:
                description: 'Version range of @jubstaa/config the doctor comes from.'
                type: string
                default: '^2'

permissions:
    contents: read

jobs:
    doctor:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Repository checks
              env:
                  DOCTOR_VERSION: ${{ inputs.doctor-version }}
              run: |
                  npm install --prefix "$RUNNER_TEMP/doctor" --no-audit --no-fund "@jubstaa/config@$DOCTOR_VERSION"
                  "$RUNNER_TEMP/doctor/node_modules/.bin/jubstaa-doctor"
