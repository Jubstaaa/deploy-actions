name: Health-gated compose deploy
description: >-
    Deploys one image tag with `docker compose up --wait`, rolls back to the previously
    running tag when the new one never becomes healthy, removes this app's old images,
    and moves :latest to the released tag. Optionally snapshots SQLite databases before
    each release and puts them back on rollback. Expects the `ssh` action to have set up the host alias first, and the compose
    file to use `image: <image>:${IMAGE_TAG:-latest}`.
inputs:
    host-alias:
        description: SSH alias written by the `ssh` action.
        required: false
        default: droplet
    app-dir:
        description: Directory on the host that holds the compose file, e.g. /opt/acw.
        required: true
    compose-file:
        description: Compose file in the repository to upload to app-dir.
        required: false
        default: docker-compose.yml
    service:
        description: Compose service to deploy.
        required: false
        default: app
    container:
        description: Container name of that service (to find the running tag for rollback).
        required: true
    image:
        description: Image name without tag, e.g. ghcr.io/owner/app.
        required: true
    tag:
        description: Tag to deploy, normally the full commit SHA.
        required: true
    health-url:
        description: >-
            URL checked from the host after compose reports healthy, e.g. http://127.0.0.1:3000/.
            Point it at an endpoint that touches the database (e.g. /api/health) so a release
            that cannot read its data is rolled back.
        required: true
    registry-user:
        description: Registry user for private images; leave empty for public ones.
        required: false
        default: ''
    registry-token:
        description: Registry token for private images (e.g. GITHUB_TOKEN with packages:read).
        required: false
        default: ''
    keep-images:
        description: >-
            This app's image tags to keep on the host after a healthy release, counting the
            live tag and the previous one (the rollback target), which are always kept.
            Older tags of `image` and its untagged images are removed; other repositories
            are never touched. 0 turns pruning off.
        required: false
        default: '2'
    sqlite-snapshot:
        description: >-
            Host paths of SQLite databases inside app-dir, one per line. Before the new tag
            starts, each is copied with SQLite's online backup API to
            <app-dir>/snapshots/<name>-<running tag>-<UTC>.sqlite and integrity-checked; a
            failed snapshot fails the deploy before anything changes. If the release is rolled
            back, the service is stopped and the snapshot is put back before the previous tag
            starts. Needs the sqlite3 CLI on the host. Empty (the default) turns it off.
        required: false
        default: ''
    keep-snapshots:
        description: Snapshots kept per database (newest first, at least 1).
        required: false
        default: '5'
    restore-snapshot:
        description: >-
            Manual rollback across a migration: 'true' starts `tag` on the newest snapshot
            taken while `tag` was running, discarding every write made since. The replaced
            database is kept as <db>.failed-<UTC>. Needs sqlite-snapshot.
        required: false
        default: 'false'
    promote-latest:
        description: Point :latest at the released tag after a healthy deploy (needs a registry login on the runner).
        required: false
        default: 'true'
runs:
    using: composite
    steps:
        - name: Check inputs
          shell: bash
          env:
              TAG: ${{ inputs.tag }}
              KEEP: ${{ inputs.keep-images }}
              KEEP_SNAPSHOTS: ${{ inputs.keep-snapshots }}
              RESTORE_SNAPSHOT: ${{ inputs.restore-snapshot }}
          run: |
              [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid image tag"; exit 1; }
              [[ "$KEEP" =~ ^[0-9]+$ ]] || { echo "::error::keep-images must be a whole number"; exit 1; }
              [[ "$KEEP_SNAPSHOTS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::keep-snapshots must be a whole number of at least 1"; exit 1; }
              [[ "$RESTORE_SNAPSHOT" == true || "$RESTORE_SNAPSHOT" == false ]] || { echo "::error::restore-snapshot must be true or false"; exit 1; }
        - name: Upload compose file
          shell: bash
          env:
              HOST: ${{ inputs.host-alias }}
              APP_DIR: ${{ inputs.app-dir }}
              COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
          run: scp "$COMPOSE_FILE_PATH" "$HOST:$APP_DIR/docker-compose.yml"
        - name: Deploy with automatic rollback
          shell: bash
          env:
              HOST: ${{ inputs.host-alias }}
              APP_DIR: ${{ inputs.app-dir }}
              SERVICE: ${{ inputs.service }}
              CONTAINER: ${{ inputs.container }}
              IMAGE: ${{ inputs.image }}
              TAG: ${{ inputs.tag }}
              HEALTH_URL: ${{ inputs.health-url }}
              REGISTRY_USER: ${{ inputs.registry-user }}
              REGISTRY_TOKEN: ${{ inputs.registry-token }}
              SQLITE_DBS: ${{ inputs.sqlite-snapshot }}
              KEEP_SNAPSHOTS: ${{ inputs.keep-snapshots }}
              RESTORE_SNAPSHOT: ${{ inputs.restore-snapshot }}
          # The token travels on stdin, never as an argument visible in `ps`. ssh joins
          # its arguments into one string for the remote shell, so each one is quoted
          # with %q first and none can inject shell syntax. The database list is joined onto
          # one line so %q never needs $'…' quoting, which a non-bash login shell would not parse.
          run: |
              SQLITE_DBS=${SQLITE_DBS//$'\n'/ }
              printf -v args '%q ' "$APP_DIR" "$SERVICE" "$CONTAINER" "$IMAGE" "$TAG" "$HEALTH_URL" "$REGISTRY_USER" \
                  "$SQLITE_DBS" "$KEEP_SNAPSHOTS" "$RESTORE_SNAPSHOT"
              { printf '%s\n' "$REGISTRY_TOKEN"; cat "$GITHUB_ACTION_PATH/remote-deploy.sh"; } |
                  ssh "$HOST" "bash -c 'read -r REGISTRY_TOKEN; export REGISTRY_TOKEN; exec bash -s -- \"\$@\"' _ $args"
        - name: Prune this app's old images
          if: inputs.keep-images != '0'
          shell: bash
          env:
              HOST: ${{ inputs.host-alias }}
              APP_DIR: ${{ inputs.app-dir }}
              IMAGE: ${{ inputs.image }}
              KEEP: ${{ inputs.keep-images }}
          # The release is already live and healthy, so a failed cleanup only warns.
          run: |
              printf -v args '%q ' "$APP_DIR" "$IMAGE" "$KEEP"
              ssh "$HOST" "bash -s -- $args" <"$GITHUB_ACTION_PATH/prune-images.sh" ||
                  echo "::warning::image prune failed; old images remain on disk"
        - name: Promote :latest
          if: inputs.promote-latest == 'true'
          shell: bash
          env:
              IMAGE: ${{ inputs.image }}
              TAG: ${{ inputs.tag }}
          run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"
